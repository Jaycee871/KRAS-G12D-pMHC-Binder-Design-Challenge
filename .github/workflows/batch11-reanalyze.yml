name: Batch 11 offline geometry reanalysis

on:
  push:
    branches: [batch11-peptide-only-design]
    paths: [.github/workflows/batch11-reanalyze.yml]

permissions:
  contents: write

jobs:
  reanalyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch11-peptide-only-design
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild crystallographic target
        run: python src/fetch_target.py
      - name: Restore archived RFdiffusion backbones
        run: |
          rm -rf results/batch-11/all_structures
          tar -xzf results/batch-11/design_backbones.tar.gz -C results/batch-11
          test "$(find results/batch-11/all_structures -name '*.pdb' | wc -l)" -eq 24
      - name: Recompute Asp6 Val8 geometry from 7OW6 sidechains
        run: python scripts/batch11_peptide_only.py --stage reanalyze
      - name: Commit corrected offline measurements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/batch-11/backbone_reanalysis.json results/batch-11/design_reanalysis.json
          if git diff --cached --quiet; then
            echo 'No corrected geometry changes.'
          else
            git commit -m 'batch-11: add corrected offline sidechain reanalysis'
            git push origin HEAD:batch11-peptide-only-design
          fi
