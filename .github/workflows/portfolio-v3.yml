name: Build Track-1 portfolio v3

on:
  push:
    branches: [submission-portfolio-v3]
    paths: [.github/workflows/portfolio-v3.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission-portfolio-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build portfolio v3
        run: python scripts/build_portfolio_v3.py
      - name: Validate v3 upload CSV
        run: python src/validate_submission.py results/final-submission/track1_portfolio30_v3.csv
      - name: Run tests
        run: python -m pytest -q
      - name: Commit generated v3 artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             results/final-submission/track1_portfolio30_v3.csv             results/final-submission/portfolio30_v3_audit.csv             results/final-submission/portfolio30_v3_summary.json
          if git diff --cached --quiet; then
            echo 'Portfolio v3 already current.'
          else
            git commit -m 'submission: generate balanced Track-1 portfolio v3'
            git push origin HEAD:submission-portfolio-v3
          fi
