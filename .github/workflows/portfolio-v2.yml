name: Build Track-1 portfolio v2

on:
  push:
    branches: [submission-portfolio-v2]
    paths: [.github/workflows/portfolio-v2.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission-portfolio-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build diversified portfolio
        run: python scripts/build_portfolio_submission.py
      - name: Validate upload CSV
        run: python src/validate_submission.py results/final-submission/track1_portfolio30.csv
      - name: Run tests
        run: python -m pytest -q
      - name: Commit generated portfolio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             results/final-submission/track1_portfolio30.csv             results/final-submission/portfolio30_audit.csv             results/final-submission/portfolio30_summary.json
          if git diff --cached --quiet; then
            echo 'Portfolio already current.'
          else
            git commit -m 'submission: generate diversified Track-1 portfolio30'
            git push origin HEAD:submission-portfolio-v2
          fi
